services:
  postgres:
    image: "postgres:18"
    container_name: promptledger-postgres
    environment:
      - "POSTGRES_DB=promptledger"
      - "POSTGRES_USER=promptledger"
      - "POSTGRES_PASSWORD=promptledger"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: "redis:8"
    container_name: promptledger-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
